[project]
name = "fraud-investigation-api"
version = "0.1.0"
description = "Evidence-grounded synthetic account takeover investigations"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "psycopg[binary]>=3.2,<4",
  "openai>=1.99,<3",
  "PyJWT>=2.10,<3"
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.vercel]
entrypoint = "app.main:app"
